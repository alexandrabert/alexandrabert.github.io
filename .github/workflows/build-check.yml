name: Build check

# Vérifie que le site compile sur les branches autres que main (pas de mise en ligne).
on:
  push:
    branches-ignore: [ main, build-preview ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # Publie le site compilé sur la branche build-preview pour pouvoir le relire avant la mise en ligne
      - name: Publish build preview
        if: github.event_name == 'push'
        run: |
          cd dist
          git init -q -b build-preview
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Build preview of ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-preview
